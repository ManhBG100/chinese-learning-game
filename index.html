<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Learning Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f8; color: #333; text-align: center; }
    header { background: #2b3a42; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; }
    nav a { color: #fff; text-decoration: none; margin-left: 15px; font-weight: bold; }
    .container { max-width: 600px; margin: 40px auto; padding: 20px; }
    
    /* Hiệu ứng lật thẻ Flashcard */
    .card-scene { perspective: 800px; margin: 20px auto; width: 320px; height: 220px; cursor: pointer; }
    .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
    .card.is-flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; background: #fff; padding: 15px; }
    .card-front { border: 2px solid #3498db; }
    .card-front .hanzi { font-size: 54px; font-weight: bold; color: #2c3e50; }
    .card-back { border: 2px solid #2ecc71; transform: rotateY(180deg); background: #fdfefe; }
    .card-back .pinyin { font-size: 24px; color: #e67e22; margin-bottom: 10px; }
    .card-back .meaning { font-size: 22px; font-weight: bold; color: #27ae60; }
    
    .btn-group { margin-top: 20px; }
    button { padding: 10px 20px; margin: 0 10px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; background: #3498db; color: white; transition: 0.2s; }
    button:hover { background: #2980b9; }
    .hint { font-size: 13px; color: #7f8c8d; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>Chinese Learning Game</h1>
    <nav>
      <a href="#flashcard">Học Thẻ</a>
      <a href="./minigames/quiz.html">Mini Game Trắc Nghiệm</a>
    </nav>
  </header>

  <div class="container" id="flashcard">
    <h2>Thẻ Từ Vựng</h2>
    <div class="card-scene" onclick="flipCard()">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="hanzi" id="hanziDisplay">...</div>
          <div class="hint">(Nhấn để lật xem nghĩa)</div>
        </div>
        <div class="card-face card-back">
          <div class="pinyin" id="pinyinDisplay">...</div>
          <div class="meaning" id="meaningDisplay">...</div>
        </div>
      </div>
    </div>
    
    <div class="btn-group">
      <button onclick="prevCard()">Từ trước</button>
      <span id="counter" style="font-weight:bold;">1 / 1</span>
      <button onclick="nextCard()">Từ sau</button>
    </div>
  </div>

  <script>
    // Dữ liệu dự phòng mặc định nếu chưa đọc được file
    let words = [
      { id: 1, hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
      { id: 2, hanzi: "谢谢", pinyin: "xièxie", meaning: "Cảm ơn" },
      { id: 3, hanzi: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" }
    ];
    let currentIndex = 0;

    // Tự động đọc file words.txt hoặc words.json nếu có trên repo
    fetch('words.txt')
      .then(res => res.text())
      .then(text => {
        const lines = text.trim().split('\n');
        if (lines.length > 1) {
          const parsed = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split('\t');
            if (cols.length >= 4) {
              parsed.push({ id: cols[0].trim(), hanzi: cols[1].trim(), pinyin: cols[2].trim(), meaning: cols[3].trim() });
            }
          }
          if (parsed.length > 0) words = parsed;
        }
        updateCard();
      })
      .catch(() => updateCard());

    function updateCard() {
      const item = words[currentIndex];
      document.getElementById('hanziDisplay').innerText = item.hanzi;
      document.getElementById('pinyinDisplay').innerText = item.pinyin;
      document.getElementById('meaningDisplay').innerText = item.meaning;
      document.getElementById('counter').innerText = `${currentIndex + 1} / ${words.length}`;
      document.getElementById('card').classList.remove('is-flipped');
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('is-flipped');
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % words.length;
      updateCard();
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + words.length) % words.length;
      updateCard();
    }
  </script>
</body>
</html>
