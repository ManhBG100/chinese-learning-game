<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Learning System</title>
  <!-- Sử dụng font chữ phong cách Code/Terminal -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #121212;
      --text-main: #f8f9fa;
      --accent-color: #00ff88; /* Màu xanh lá phong cách Terminal */
      --accent-secondary: #00a8ff; /* Xanh dương điểm nhấn */
      --border-color: #495057;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
      border-radius: 0 !important; /* KHÔNG BO TRÒN BẤT CỨ ĐÂU */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px; /* Lưới nền tạo cảm giác bản vẽ kỹ thuật */
    }

    /* Container chính: Chứa 2 cột */
    .system-container {
      display: flex;
      flex-direction: row-reverse; /* Tiêu đề bên phải */
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1000px;
      gap: 60px;
      border: 2px solid var(--border-color);
      padding: 60px;
      background: #1a1a1a;
      box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.5); /* Đổ bóng cứng */
    }

    /* --- TIÊU ĐỀ LỆCH PHẢI --- */
    .header-section {
      flex: 1;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .project-code {
      color: var(--border-color);
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .main-title {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.2;
      text-transform: uppercase;
      color: var(--text-main);
      margin-bottom: 20px;
      border-right: 8px solid var(--accent-color);
      padding-right: 15px;
    }

    .main-title span {
      color: var(--accent-color);
    }

    .status-bar {
      display: inline-block;
      padding: 6px 12px;
      background: #2b2b2b;
      border: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--accent-secondary);
    }

    /* --- MENU BÊN TRÁI --- */
    .menu-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .menu-btn {
      background: #1a1a1a;
      color: var(--text-main);
      border: 2px solid var(--text-main);
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      text-align: left;
      position: relative;
      transition: transform 0.1s;
      box-shadow: -6px 6px 0px var(--border-color); /* Đổ bóng khối cứng bên trái */
      display: flex;
      justify-content: space-between;
    }

    .menu-btn:hover:not(.disabled) {
      background: var(--text-main);
      color: #000;
      box-shadow: -6px 6px 0px var(--accent-color);
      transform: translate(2px, -2px);
    }

    .menu-btn:active:not(.disabled) {
      box-shadow: 0px 0px 0px var(--accent-color);
      transform: translate(-4px, 4px); /* Hiệu ứng lún nút vật lý */
    }

    .menu-btn.primary {
      border-color: var(--accent-color);
      box-shadow: -6px 6px 0px var(--accent-color);
    }

    .menu-btn.primary:hover {
      background: var(--accent-color);
    }

    .menu-btn.disabled {
      color: #555;
      border-color: #333;
      box-shadow: -6px 6px 0px #111;
      cursor: not-allowed;
    }

    /* --- MODAL (CỬA SỔ HIỂN THỊ) --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background: #1a1a1a;
      border: 2px solid var(--accent-color);
      padding: 0;
      width: 90%;
      max-width: 550px;
      box-shadow: 12px 12px 0px rgba(0, 255, 136, 0.2);
    }

    .modal-header {
      background: var(--accent-color);
      color: #000;
      padding: 15px 20px;
      font-weight: 800;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-icon {
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      line-height: 1;
    }

    .close-icon:hover {
      color: #fff;
    }

    .modal-content {
      padding: 30px;
    }

    .game-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-link {
      display: flex;
      align-items: center;
      background: #222;
      color: var(--text-main);
      padding: 14px 15px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .game-link span.index {
      color: var(--accent-color);
      margin-right: 15px;
    }

    .game-link:hover {
      background: var(--text-main);
      color: #000;
      border-color: var(--text-main);
      transform: translateX(10px);
    }

    .game-link:hover span.index {
      color: #000;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .system-container {
        flex-direction: column;
        padding: 30px;
        box-shadow: none;
      }
      .header-section {
        align-items: center;
        text-align: center;
        border-right: none;
        border-bottom: 4px solid var(--accent-color);
        padding-bottom: 20px;
        padding-right: 0;
      }
    }
  </style>
</head>
<body>

  <div class="system-container">
    <!-- Tiêu đề (Phải) -->
    <div class="header-section">
      <div class="project-code">/// SYSTEM.INITIALIZED</div>
      <h1 class="main-title">Hệ Thống<br>Học <span>Hán Tự</span></h1>
      <div class="status-bar">STATUS: ONLINE_</div>
    </div>

    <!-- Menu (Trái) -->
    <div class="menu-section">
      <button class="menu-btn primary" onclick="openGameModal()">
        [ Khởi động Module ] <span>&gt;</span>
      </button>
      <button class="menu-btn disabled" title="Module chưa sẵn sàng">
        [ Dữ liệu Flashcard ] <span>&gt;</span>
      </button>
      <button class="menu-btn disabled" title="Module chưa sẵn sàng">
        [ Tùy chỉnh Hệ thống ] <span>&gt;</span>
      </button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-box">
      <!-- Thanh tiêu đề cửa sổ -->
      <div class="modal-header">
        <span>&gt;_ CHỌN MODULE LUYỆN TẬP</span>
        <span class="close-icon" onclick="closeGameModal()">X</span>
      </div>
      
      <!-- Nội dung cửa sổ -->
      <div class="modal-content">
        <div class="game-list">
          <a href="./minigames/quiz.html" class="game-link">
            <span class="index">01.</span> Trắc Nghiệm Hán Tự
          </a>
          <a href="./minigames/draw.html" class="game-link">
            <span class="index">02.</span> Luyện Viết (Quick Draw)
          </a>
          <a href="./minigames/fishing.html" class="game-link">
            <span class="index">03.</span> Trò Chơi Câu Cá
          </a>
          <a href="./minigames/horse_racing.html" class="game-link">
            <span class="index">04.</span> Đua Ngựa Chữ Hán
          </a>
          <a href="./minigames/exam_cheat.html" class="game-link">
            <span class="index">05.</span> Thử Thách Vượt Kỳ Thi
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openGameModal() {
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGameModal() {
      document.getElementById('gameModal').style.display = 'none';
    }

    // Đóng khi click ngoài khung modal
    window.onclick = function(event) {
      const modal = document.getElementById('gameModal');
      if (event.target === modal) {
        closeGameModal();
      }
    }
  </script>
</body>
</html>
