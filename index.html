<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Learning Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .main-title {
      font-size: 42px;
      letter-spacing: 2px;
      margin-bottom: 50px;
      text-transform: uppercase;
      color: #00d2d3;
      text-shadow: 0 0 15px rgba(0, 210, 211, 0.4);
    }

    /* Khung chứa các nút điều hướng */
    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
    }

    .menu-btn {
      background: #1e1e1e;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    .menu-btn:hover {
      background: #2a2a2a;
      border-color: #00d2d3;
      color: #00d2d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 210, 211, 0.2);
    }

    .menu-btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #262626;
    }

    .menu-btn.disabled:hover {
      background: #1e1e1e;
      color: #ffffff;
      border-color: #262626;
      transform: none;
      box-shadow: none;
    }

    /* Modal danh sách Game hiện lên khi bấm Game Option */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .modal-box {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }

    .modal-box h2 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #ff9f43;
    }

    .game-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .game-link {
      display: block;
      background: #2d3436;
      color: #fff;
      padding: 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      border: 1px solid #485460;
      transition: 0.2s;
    }

    .game-link:hover {
      background: #00d2d3;
      color: #121212;
      font-weight: bold;
    }

    .close-btn {
      margin-top: 25px;
      background: transparent;
      border: 1px solid #555;
      color: #aaa;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
      border-color: #fff;
    }
  </style>
</head>
<body>

  <h1 class="main-title">Chinese Game</h1>

  <div class="menu-container">
    <button class="menu-btn" onclick="openGameModal()">Game Option</button>
    <button class="menu-btn disabled" title="Chức năng đang cập nhật">Data</button>
    <button class="menu-btn disabled" title="Chức năng đang cập nhật">Contact Us</button>
  </div>

  <!-- Popup hiển thị các Mini-game -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-box">
      <h2>Danh Sách Trò Chơi</h2>
      <div class="game-list">
        <a href="./minigames/quiz.html" class="game-link">1. Trắc Nghiệm Hán Tự</a>
        <a href="./minigames/draw.html" class="game-link">2. Quick Draw Hán Tự (Tập Vẽ Chữ)</a>
        <a href="./minigames/fishing.html" class="game-link">3. Câu con mẹ nó cá</a>
      </div>
      <button class="close-btn" onclick="closeGameModal()">Đóng</button>
    </div>
  </div>

  <script>
    function openGameModal() {
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGameModal() {
      document.getElementById('gameModal').style.display = 'none';
    }

    // Đóng popup khi click ra ngoài vùng đen
    window.onclick = function(event) {
      const modal = document.getElementById('gameModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }
  </script>
</body>
</html>
