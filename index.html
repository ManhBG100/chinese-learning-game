<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Learning System</title>
  
  <style>
    /* 1. FONT PIXEL VIỆT HÓA */
    @font-face {
      font-family: "PixelVN";
      src: url("./asset/pixel-vn.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PixelVN", monospace, sans-serif;
      user-select: none;
      border-radius: 0 !important;
    }

    /* TOÀN MÀN HÌNH LÀ NỀN GIF */
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000 url("./asset/background.gif") no-repeat center center / cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* KHUNG TƯƠNG ĐỐI CHỨA CẢ MŨI TÊN VÀ NỘI DUNG */
    .menu-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 340px;
      max-width: 90vw;
    }

    /* MŨI TÊN TO, NẰM Ở GÓC TRÊN BÊN TRÁI CỦA KHUNG NỘI DUNG */
    #back-btn {
      display: none; /* Mặc định ẩn, chỉ hiện khi vào menu con */
      position: absolute;
      top: -75px;    /* Đẩy lên phía trên cụm danh sách */
      left: 0;       /* Canh thẳng hàng với mép trái của khung */
      background: none;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 54px; /* Mũi tên to rõ */
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      z-index: 100;
      text-shadow: 4px 4px 0px #000000;
      transition: all 0.15s ease;
    }

    #back-btn:hover {
      color: #888888;
      transform: translateX(-8px); /* Trượt nhẹ sang trái khi hover */
    }

    /* KHUNG CHỨA CÁC MÀN HÌNH CHỮ */
    .view-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      z-index: 10;
    }

    /* 1. MENU CHÍNH */
    .main-btn {
      font-size: 26px;
      color: #ffffff;
      background: none;
      border: none;
      outline: none;
      padding: 6px 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 4px;
      line-height: 1.5;
      text-decoration: none;
      text-shadow: 3px 3px 0px #000000;
      transition: all 0.15s ease;
    }

    .main-btn:hover {
      color: transparent;
      -webkit-text-stroke: 1.5px #ffffff;
      text-decoration: underline;
      text-underline-offset: 10px;
      text-decoration-thickness: 3px;
      text-decoration-color: #ffffff;
      text-shadow: none;
    }

    /* 2. DANH SÁCH GAME */
    #learn-view {
      display: none;
      align-items: flex-start; /* Canh thẳng hàng mép trái khớp với mũi tên */
      gap: 22px;
      width: 100%;
    }

    .game-item {
      font-size: 20px;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 3px;
      line-height: 1.6;
      text-shadow: 3px 3px 0px #000000;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .game-item:hover {
      color: #999999;
      transform: translateX(8px);
    }

    /* 3. DỮ LIỆU & LIÊN HỆ */
    #data-view, #contact-view {
      display: none;
      text-align: center;
      gap: 18px;
    }

    .info-text {
      color: #ffffff;
      font-size: 16px;
      letter-spacing: 2px;
      line-height: 1.8;
      text-shadow: 3px 3px 0px #000000;
    }

    @media (max-width: 768px) {
      #back-btn {
        font-size: 42px;
        top: -60px;
      }
      .main-btn {
        font-size: 20px;
        letter-spacing: 2px;
      }
      .game-item {
        font-size: 15px;
        letter-spacing: 2px;
      }
      .info-text {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- KHUNG BAO TƯƠNG ĐỐI TRUNG TÂM -->
  <div class="menu-stage">

    <!-- MŨI TÊN NẰM TRONG KHUNG NÀY -->
    <button id="back-btn" onclick="showMain()" title="Quay lại">←</button>

    <!-- MENU CHÍNH -->
    <main id="main-view" class="view-container">
      <button class="main-btn" onclick="openView('learn-view')">HỌC TẬP</button>
      <button class="main-btn" onclick="openView('data-view')">DỮ LIỆU</button>
      <button class="main-btn" onclick="openView('contact-view')">LIÊN HỆ</button>
    </main>

    <!-- DANH SÁCH GAME -->
    <div id="learn-view" class="view-container">
      <a href="./minigames/quiz.html" class="game-item">Trắc Nghiệm Hán Tự</a>
      <a href="./minigames/draw.html" class="game-item">Luyện Viết (Quick Draw)</a>
      <a href="./minigames/fishing.html" class="game-item">Trò Chơi Câu Cá</a>
      <a href="./minigames/horse_racing.html" class="game-item">Đua Ngựa Chữ Hán</a>
      <a href="./minigames/exam_cheat.html" class="game-item">Vượt Qua Kỳ Thi</a>
    </div>

    <!-- DỮ LIỆU -->
    <div id="data-view" class="view-container">
      <p class="info-text">HỆ THỐNG: HSK 1 - HSK 6</p>
      <p class="info-text">TỔNG TỪ VỰNG: 5,000+ TỪ</p>
      <p class="info-text">BỘ THỦ CƠ BẢN: 214 BỘ</p>
    </div>

    <!-- LIÊN HỆ -->
    <div id="contact-view" class="view-container">
      <p class="info-text">DỰ ÁN: CHINESE TERMINAL</p>
      <p class="info-text">EMAIL: FU.MOTIVATORS@GMAIL.COM</p>
      <p class="info-text">GITHUB: GITHUB.COM/MANHBG100</p>
    </div>

  </div>

  <script>
    function openView(viewId) {
      document.getElementById('main-view').style.display = 'none';
      document.getElementById('learn-view').style.display = 'none';
      document.getElementById('data-view').style.display = 'none';
      document.getElementById('contact-view').style.display = 'none';

      document.getElementById(viewId).style.display = 'flex';
      document.getElementById('back-btn').style.display = 'block';
    }

    function showMain() {
      document.getElementById('learn-view').style.display = 'none';
      document.getElementById('data-view').style.display = 'none';
      document.getElementById('contact-view').style.display = 'none';
      document.getElementById('back-btn').style.display = 'none';

      document.getElementById('main-view').style.display = 'flex';
    }
  </script>
</body>
</html>
