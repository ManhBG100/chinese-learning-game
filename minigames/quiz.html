<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-game: Trắc nghiệm Hán tự</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f0f3f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .game-box { background: white; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; color: #555; }
    .back-btn { text-decoration: none; color: #3498db; font-size: 14px; }
    .question-box { margin: 25px 0; }
    .hanzi-target { font-size: 56px; font-weight: bold; color: #2c3e50; }
    .pinyin-target { font-size: 20px; color: #e67e22; margin-top: 5px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
    button.opt-btn { padding: 14px 10px; font-size: 16px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fafafa; cursor: pointer; transition: 0.2s; font-weight: 500; }
    button.opt-btn:hover { background: #edf2f7; border-color: #cbd5e0; }
    button.correct { background: #2ecc71 !important; color: white; border-color: #27ae60 !important; }
    button.wrong { background: #e74c3c !important; color: white; border-color: #c0392b !important; }
    .score-board { font-size: 18px; color: #27ae60; font-weight: bold; }
  </style>
</head>
<body>

  <div class="game-box">
    <div class="top-bar">
      <a href="../index.html" class="back-btn">← Về trang chủ</a>
      <div class="score-board">Điểm: <span id="score">0</span></div>
    </div>

    <div class="question-box">
      <div class="hanzi-target" id="targetHanzi">...</div>
      <div class="pinyin-target" id="targetPinyin">...</div>
      <p style="margin-top: 10px; color: #7f8c8d; font-size: 14px;">Chọn nghĩa tiếng Việt đúng nhất:</p>
    </div>

    <div class="options-grid" id="optionsContainer"></div>
  </div>

  <script>
    let words = [
      { id: 1, hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
      { id: 2, hanzi: "谢谢", pinyin: "xièxie", meaning: "Cảm ơn" },
      { id: 3, hanzi: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" },
      { id: 4, hanzi: "苹果", pinyin: "píngguǒ", meaning: "Quả táo" },
      { id: 5, hanzi: "学习", pinyin: "xuéxí", meaning: "Học tập" }
    ];

    let currentQuestion = null;
    let score = 0;

    // Đọc dữ liệu từ file words.txt ở thư mục cha
    fetch('../words.txt')
      .then(res => res.text())
      .then(text => {
        const lines = text.trim().split('\n');
        if (lines.length > 1) {
          const parsed = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split('\t');
            if (cols.length >= 4) {
              parsed.push({ id: cols[0].trim(), hanzi: cols[1].trim(), pinyin: cols[2].trim(), meaning: cols[3].trim() });
            }
          }
          if (parsed.length > 0) words = parsed;
        }
        nextRound();
      })
      .catch(() => nextRound());

    function nextRound() {
      // Chọn ngẫu nhiên 1 từ làm câu hỏi
      currentQuestion = words[Math.floor(Math.random() * words.length)];
      document.getElementById('targetHanzi').innerText = currentQuestion.hanzi;
      document.getElementById('targetPinyin').innerText = currentQuestion.pinyin;

      // Gom 1 đáp án đúng và các đáp án sai khác
      let wrongOptions = words.filter(w => w.meaning !== currentQuestion.meaning);
      wrongOptions.sort(() => 0.5 - Math.random());
      
      let choices = [currentQuestion.meaning];
      for (let i = 0; i < Math.min(3, wrongOptions.length); i++) {
        choices.push(wrongOptions[i].meaning);
      }
      choices.sort(() => 0.5 - Math.random());

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      choices.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt);
        container.appendChild(btn);
      });
    }

    function checkAnswer(button, selected) {
      const allButtons = document.querySelectorAll('.opt-btn');
      allButtons.forEach(btn => btn.disabled = true);

      if (selected === currentQuestion.meaning) {
        button.classList.add('correct');
        score += 10;
        document.getElementById('score').innerText = score;
      } else {
        button.classList.add('wrong');
        allButtons.forEach(btn => {
          if (btn.innerText === currentQuestion.meaning) btn.classList.add('correct');
        });
      }

      setTimeout(nextRound, 1200);
    }
  </script>
</body>
</html>
