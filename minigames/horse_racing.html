<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đường Đua Hán Tự - Horse Racing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    .header-bar {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .btn-back { color: #00d2d3; text-decoration: none; font-weight: bold; font-size: 14px; }
    .race-info { font-size: 14px; color: #feca57; font-weight: bold; }

    /* Khu vực trò chơi */
    .game-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      display: flex;
      gap: 10px;
    }

    /* 1. Thanh đo quãng đường bên trái */
    .track-sidebar {
      width: 60px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
    }
    .finish-icon { font-size: 20px; margin-bottom: 5px; }
    .progress-rail {
      position: relative;
      width: 8px;
      height: 380px;
      background: #2d3436;
      border-radius: 4px;
      margin-top: 5px;
    }
    .runner-marker {
      position: absolute;
      left: 50%;
      transform: translate(-50%, 50%);
      font-size: 18px;
      transition: bottom 0.1s linear;
    }
    .marker-p { filter: drop-shadow(0 0 5px #00d2d3); z-index: 3; }
    .marker-npc1 { filter: drop-shadow(0 0 5px #ff6b6b); z-index: 2; }
    .marker-npc2 { filter: drop-shadow(0 0 5px #feca57); z-index: 2; }

    /* 2. Màn hình đường đua Canvas */
    .canvas-container {
      position: relative;
      flex: 1;
    }
    #raceCanvas {
      width: 100%;
      height: auto;
      aspect-ratio: 700 / 460;
      background: #27ae60;
      border-radius: 10px;
      border: 2px solid #444;
      display: block;
      box-shadow: 0 6px 25px rgba(0,0,0,0.7);
    }

    /* Thanh đo tốc độ phía trên Canvas */
    .speed-gauge-box {
      position: absolute;
      top: 12px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .speed-bar-bg {
      width: 100px;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
    }
    .speed-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #feca57, #ff4757);
      transition: width 0.05s linear;
    }
    .speed-bar-fill.boosted {
      background: linear-gradient(90deg, #00d2d3, #0984e3);
      box-shadow: 0 0 8px #00d2d3;
    }

    /* Popup trắc nghiệm tăng tốc ở đáy màn hình */
    .quiz-overlay-strip {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(20, 24, 33, 0.94);
      border: 2px solid #00d2d3;
      border-radius: 8px;
      padding: 10px 15px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0,210,211,0.3);
      z-index: 10;
    }
    .quiz-top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quiz-prompt { font-size: 18px; font-weight: bold; color: #00d2d3; }
    .quiz-pinyin { font-size: 13px; color: #aaa; margin-left: 8px; }
    .quiz-timer-bar-bg {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
      margin: 3px 0 6px 0;
    }
    .quiz-timer-bar-fill {
      width: 100%;
      height: 100%;
      background: #ff6b6b;
      transition: width 0.1s linear;
    }
    .quiz-btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .quiz-opt-btn {
      background: #2d3436;
      color: #fff;
      border: 1px solid #485460;
      padding: 8px 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quiz-opt-btn:active { background: #00d2d3; color: #111; }

    /* Bảng điều khiển Mobile */
    .mobile-controls {
      display: none;
      width: 100%;
      max-width: 820px;
      justify-content: space-between;
      gap: 15px;
      margin-top: 8px;
    }
    .btn-steer {
      flex: 1;
      background: #2d3436;
      border: 1px solid #555;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }
    .btn-mash {
      flex: 2;
      background: linear-gradient(180deg, #ff9f43, #ee5253);
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(238, 82, 83, 0.4);
    }
    .btn-mash:active, .btn-steer:active { transform: scale(0.96); }

    /* Hướng dẫn trên PC */
    .pc-guide {
      margin-top: 8px;
      color: #888;
      font-size: 13px;
      text-align: center;
    }
    .kbd { background: #333; color: #00d2d3; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    @media (pointer: coarse) {
      .mobile-controls { display: flex !important; }
      .pc-guide { display: none !important; }
      .quiz-btn-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Modal kết thúc */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-card {
      background: #1e1e1e;
      border: 2px solid #feca57;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .btn-action {
      background: #00d2d3;
      color: #111;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <a href="../index.html" class="btn-back">← Về Hub</a>
    <div class="race-info">Đích đến: <span id="distDisplay">0</span> / 1000m</div>
  </div>

  <div class="game-wrapper">
    <!-- Thanh quãng đường bên trái -->
    <div class="track-sidebar">
      <div class="finish-icon">🏁</div>
      <div class="progress-rail">
        <div class="runner-marker marker-p" id="markerP" style="bottom: 0%;">🏇</div>
        <div class="runner-marker marker-npc1" id="markerNpc1" style="bottom: 0%;">🐴</div>
        <div class="runner-marker marker-npc2" id="markerNpc2" style="bottom: 0%;">🦄</div>
      </div>
      <div style="font-size:16px; margin-top:5px;">🚩</div>
    </div>

    <!-- Màn hình đua Canvas -->
    <div class="canvas-container">
      <canvas id="raceCanvas" width="700" height="460"></canvas>

      <!-- Đồng hồ tốc độ -->
      <div class="speed-gauge-box">
        <span>⚡ Tốc độ:</span>
        <div class="speed-bar-bg">
          <div class="speed-bar-fill" id="speedBarFill"></div>
        </div>
        <span id="speedVal" style="font-weight:bold; min-width:35px;">0%</span>
      </div>

      <!-- Khung câu hỏi xuất hiện ở dưới đáy -->
      <div class="quiz-overlay-strip" id="quizStrip">
        <div class="quiz-top-info">
          <div>
            <span class="quiz-prompt" id="quizHanzi">你好</span>
            <span class="quiz-pinyin" id="quizPinyin">(nǐ hǎo)</span>
          </div>
          <span style="font-size:11px; color:#feca57;">🚀 Trả lời đúng để Bứt Tốc!</span>
        </div>
        <div class="quiz-timer-bar-bg">
          <div class="quiz-timer-bar-fill" id="quizTimerBar"></div>
        </div>
        <div class="quiz-btn-grid" id="quizOptions"></div>
      </div>
    </div>
  </div>

  <!-- Nút điều khiển Mobile -->
  <div class="mobile-controls">
    <button class="btn-steer" id="btnLeft">⬅ Trái</button>
    <button class="btn-mash" id="btnMash">⚡ BẤM CHẠY (W/SPACE)</button>
    <button class="btn-steer" id="btnRight">Phải ➡</button>
  </div>

  <!-- Hướng dẫn Desktop -->
  <div class="pc-guide">
    🎮 <b>Né làn:</b> <span class="kbd">A</span> / <span class="kbd">D</span> hoặc <span class="kbd">←</span> <span class="kbd">→</span> &nbsp;|&nbsp;
    🚀 <b>Tăng tốc:</b> Bấm <span class="kbd">W</span> hoặc <span class="kbd">SPACE</span> liên tục &nbsp;|&nbsp;
    📝 <b>Bứt tốc:</b> Nhấp chọn nghĩa đúng khi câu hỏi bật lên
  </div>

  <!-- Modal Tổng kết giải đua -->
  <div class="modal-overlay" id="endModal">
    <div class="modal-card">
      <h2 style="color:#feca57; margin-bottom:12px;" id="endTitle">VỀ ĐÍCH!</h2>
      <p id="endDetails" style="color:#ccc; line-height:1.6; font-size:14px;"></p>
      <button class="btn-action" onclick="location.reload()">Đua Lại Vòng Khác</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('raceCanvas');
    const ctx = canvas.getContext('2d');

    const TOTAL_RACE_DIST = 1000;
    const LANES_X = [160, 350, 540];

    let words = [
      { id: 1, hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
      { id: 2, hanzi: "谢谢", pinyin: "xièxie", meaning: "Cảm ơn" },
      { id: 3, hanzi: "苹果", pinyin: "píngguǒ", meaning: "Quả táo" },
      { id: 4, hanzi: "学习", pinyin: "xuéxí", meaning: "Học tập" },
      { id: 5, hanzi: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" }
    ];

    // Đọc từ vựng từ words.txt
    fetch('../words.txt')
      .then(res => res.text())
      .then(txt => {
        const lines = txt.trim().split('\n');
        if (lines.length > 1) {
          const list = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split('\t');
            if (cols.length >= 4) {
              list.push({ id: cols[0].trim(), hanzi: cols[1].trim(), pinyin: cols[2].trim(), meaning: cols[3].trim() });
            }
          }
          if (list.length > 0) words = list;
        }
      }).catch(() => {});

    // Trạng thái người chơi
    let player = {
      lane: 1,
      targetX: LANES_X[1],
      currentX: LANES_X[1],
      y: 370,
      speed: 0,           // 0 đến 100
      maxSpeed: 85,
      boostTimer: 0,      // Thời gian duy trì buff bứt tốc
      distance: 0,
      stumbleTimer: 0,    // Bị khựng khi va rào cản
      legSwing: 0
    };

    // 2 NPC đối thủ
    let npc1 = { name: "A Cường", icon: "🐴", color: "#ff6b6b", distance: 0, speed: 45, lane: 0 };
    let npc2 = { name: "Tiểu Hồ", icon: "🦄", color: "#feca57", distance: 0, speed: 48, lane: 2 };

    // Mảng chướng ngại vật (Hàng rào gỗ 🪵)
    let obstacles = [];
    let obstacleTimer = 0;
    let trackScroll = 0;
    let gameEnded = false;

    // Quản lý câu hỏi bứt tốc
    let quizActive = false;
    let quizTimer = 0;
    const QUIZ_DURATION = 240; // ~4 giây (60fps)
    let nextQuizCooldown = 180; // ~3 giây sau khi vào game sẽ hiện câu đầu

    // ---------------- LẮNG NGHE ĐIỀU KHIỂN ----------------
    window.addEventListener('keydown', e => {
      if (gameEnded) return;
      const k = e.key.toLowerCase();

      // Di chuyển làn
      if (k === 'a' || k === 'arrowleft') steerLeft();
      else if (k === 'd' || k === 'arrowright') steerRight();

      // Bấm nút W hoặc Space liên tục để duy trì và tăng tốc độ
      if (k === 'w' || e.code === 'Space') {
        e.preventDefault();
        mashAccelerate();
      }
    });

    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); steerLeft(); });
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); steerRight(); });
    document.getElementById('btnMash').addEventListener('touchstart', (e) => { e.preventDefault(); mashAccelerate(); });

    function steerLeft() {
      if (player.lane > 0) {
        player.lane--;
        player.targetX = LANES_X[player.lane];
      }
    }

    function steerRight() {
      if (player.lane < 2) {
        player.lane++;
        player.targetX = LANES_X[player.lane];
      }
    }

    function mashAccelerate() {
      if (player.stumbleTimer > 0) return;
      // Mỗi lần bấm cộng dồn tốc độ
      player.speed = Math.min(player.maxSpeed, player.speed + 12);
    }

    // ---------------- HỆ THỐNG CÂU HỎI BỨT TỐC ----------------
    function triggerQuiz() {
      if (quizActive || gameEnded) return;
      quizActive = true;
      quizTimer = QUIZ_DURATION;

      const q = words[Math.floor(Math.random() * words.length)];
      document.getElementById('quizHanzi').innerText = q.hanzi;
      document.getElementById('quizPinyin').innerText = `(${q.pinyin})`;

      let wrongs = words.filter(w => w.meaning !== q.meaning).sort(() => 0.5 - Math.random());
      let choices = [q.meaning];
      for (let i = 0; i < Math.min(3, wrongs.length); i++) choices.push(wrongs[i].meaning);
      choices.sort(() => 0.5 - Math.random());

      const grid = document.getElementById('quizOptions');
      grid.innerHTML = '';
      choices.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(opt === q.meaning);
        grid.appendChild(btn);
      });

      document.getElementById('quizStrip').style.display = 'flex';
    }

    function handleAnswer(isCorrect) {
      if (!quizActive) return;
      closeQuiz();

      if (isCorrect) {
        // Kích hoạt buff bứt tốc trong 3 giây
        player.boostTimer = 180;
        player.speed = 120; // Vượt max tốc độ bình thường
      } else {
        // Trả lời sai bị hụt tốc độ
        player.speed = Math.max(0, player.speed - 25);
      }
      nextQuizCooldown = 360 + Math.random() * 120; // 6-8 giây sau mới có câu tiếp
    }

    function closeQuiz() {
      quizActive = false;
      document.getElementById('quizStrip').style.display = 'none';
    }

    // ---------------- CẬP NHẬT LOGIC GAME (UPDATE) ----------------
    function update() {
      if (gameEnded) return;

      // 1. Tụt tốc độ nhanh chóng nếu không bấm W/Space liên tục
      if (player.boostTimer > 0) {
        player.boostTimer--;
        player.speed = 120; // Duy trì tốc độ cực đại khi đang buff
      } else {
        // Tụt tốc độ tự nhiên
        player.speed = Math.max(0, player.speed - 1.15);
      }

      // Xử lý va chạm chướng ngại vật
      if (player.stumbleTimer > 0) {
        player.stumbleTimer--;
        player.speed = 0; // Bị khựng lại hoàn toàn
      }

      // Di chuyển mượt giữa các làn
      player.currentX += (player.targetX - player.currentX) * 0.22;

      // 2. Tính quãng đường đã chạy
      const realSpeed = player.speed * 0.05;
      player.distance += realSpeed;
      if (player.speed > 5) player.legSwing += player.speed * 0.005;

      // 3. NPC chạy tự động với tốc độ biến thiên
      npc1.distance += (npc1.speed + Math.sin(Date.now() * 0.002) * 8) * 0.05;
      npc2.distance += (npc2.speed + Math.cos(Date.now() * 0.0025) * 8) * 0.05;

      // 4. Sinh chướng ngại vật (Hàng rào)
      obstacleTimer++;
      if (obstacleTimer > 80 && player.speed > 10) {
        obstacleTimer = 0;
        const randomLane = Math.floor(Math.random() * 3);
        obstacles.push({
          lane: randomLane,
          x: LANES_X[randomLane],
          y: -50
        });
      }

      // Di chuyển và kiểm tra va chạm chướng ngại vật
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += realSpeed * 1.6 + 2.5;

        // Va chạm nếu cùng làn và sát toạ độ Y
        if (player.lane === obs.lane && obs.y > player.y - 25 && obs.y < player.y + 35) {
          if (player.boostTimer > 0) {
            // Đang bứt tốc thì tông vỡ rào cản
            obstacles.splice(i, 1);
          } else {
            // Tông rào cản -> dừng hẳn
            player.speed = 0;
            player.stumbleTimer = 45;
            obstacles.splice(i, 1);
          }
          continue;
        }

        if (obs.y > canvas.height + 50) obstacles.splice(i, 1);
      }

      // 5. Đồng hồ đếm ngược câu hỏi
      if (quizActive) {
        quizTimer--;
        const pct = (quizTimer / QUIZ_DURATION) * 100;
        document.getElementById('quizTimerBar').style.width = pct + '%';
        if (quizTimer <= 0) {
          closeQuiz();
          nextQuizCooldown = 250;
        }
      } else {
        nextQuizCooldown--;
        if (nextQuizCooldown <= 0 && player.speed > 20) {
          triggerQuiz();
        }
      }

      // 6. Cập nhật UI thanh tốc độ và quãng đường
      const speedPct = Math.min(100, Math.round((player.speed / player.maxSpeed) * 100));
      const speedBar = document.getElementById('speedBarFill');
      speedBar.style.width = speedPct + '%';
      document.getElementById('speedVal').innerText = Math.round(player.speed) + ' km/h';

      if (player.boostTimer > 0) speedBar.classList.add('boosted');
      else speedBar.classList.remove('boosted');

      document.getElementById('distDisplay').innerText = Math.min(TOTAL_RACE_DIST, Math.round(player.distance));

      // Cập nhật vị trí trên thanh tiến trình bên trái
      document.getElementById('markerP').style.bottom = `${Math.min(100, (player.distance / TOTAL_RACE_DIST) * 100)}%`;
      document.getElementById('markerNpc1').style.bottom = `${Math.min(100, (npc1.distance / TOTAL_RACE_DIST) * 100)}%`;
      document.getElementById('markerNpc2').style.bottom = `${Math.min(100, (npc2.distance / TOTAL_RACE_DIST) * 100)}%`;

      // Kiểm tra có ai chạm đích 1000m
      if (player.distance >= TOTAL_RACE_DIST || npc1.distance >= TOTAL_RACE_DIST || npc2.distance >= TOTAL_RACE_DIST) {
        finishRace();
      }
    }

    // ---------------- VẼ ĐỒ HOẠ TRÊN CANVAS (DRAW) ----------------
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Đường chạy 3 làn
      ctx.fillStyle = "#8d6e63"; // Đường đất chạy
      ctx.fillRect(80, 0, 540, canvas.height);

      // Viền cỏ 2 bên
      ctx.fillStyle = "#27ae60";
      ctx.fillRect(0, 0, 80, canvas.height);
      ctx.fillRect(620, 0, 80, canvas.height);

      // Vạch kẻ chia 3 làn đường (Cuộn theo tốc độ người chơi)
      trackScroll += player.speed * 0.15;
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 4;
      ctx.setLineDash([25, 25]);
      ctx.lineDashOffset = -trackScroll;

      // 2 vạch phân làn
      ctx.beginPath();
      ctx.moveTo(255, 0); ctx.lineTo(255, canvas.height);
      ctx.moveTo(445, 0); ctx.lineTo(445, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]); // Reset line dash

      // 2. Vẽ Chướng ngại vật (Hàng rào gỗ 🪵)
      obstacles.forEach(obs => {
        ctx.fillStyle = "#d35400";
        ctx.beginPath();
        ctx.roundRect(obs.x - 38, obs.y - 10, 76, 22, 5);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Vân sọc cảnh báo rào chắn
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(obs.x - 25, obs.y - 10, 10, 22);
        ctx.fillRect(obs.x + 15, obs.y - 10, 10, 22);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🚧 RÀO", obs.x, obs.y + 5);
      });

      // 3. Vẽ NPC khi ở gần tầm nhìn màn hình của người chơi
      [npc1, npc2].forEach(npc => {
        const distDiff = npc.distance - player.distance;
        // Nếu chênh lệch quãng đường trong khoảng [-30m, +35m] thì vẽ lên màn hình
        if (distDiff > -30 && distDiff < 40) {
          const npcScreenY = player.y - (distDiff * 9);
          drawHorse(LANES_X[npc.lane], npcScreenY, npc.color, npc.icon, npc.name, false);
        }
      });

      // 4. Vẽ Ngựa của người chơi
      drawHorse(player.currentX, player.y, "#0984e3", "🏇", "Bạn (P)", player.boostTimer > 0, player.stumbleTimer > 0);
    }

    // Hàm vẽ hình thái ngựa và kỵ sĩ
    function drawHorse(x, y, color, icon, name, isBoosted, isStumbled) {
      ctx.save();
      ctx.translate(x, y);

      // Hiệu ứng phát sáng khi bứt tốc
      if (isBoosted) {
        ctx.shadowColor = "#00d2d3";
        ctx.shadowBlur = 20;
        ctx.fillStyle = "rgba(0, 210, 211, 0.3)";
        ctx.beginPath();
        ctx.ellipse(0, 0, 45, 55, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Khói bụi dưới chân khi chạy nhanh
      if (player.speed > 40 && !isStumbled) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.beginPath();
        ctx.arc(-15, 25, 8, 0, Math.PI * 2);
        ctx.arc(15, 25, 10, 0, Math.PI * 2);
        ctx.fill();
      }

      // Thân ngựa (Hình oval)
      ctx.fillStyle = isStumbled ? "#7f8c8d" : color;
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 34, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Đầu ngựa
      ctx.beginPath();
      ctx.ellipse(0, -32, 12, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      // Kỵ sĩ ngồi trên lưng (Emoji / Biểu tượng)
      ctx.font = "26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(icon, 0, 8);

      // Tên nhân vật
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(name, 0, -50);

      // Cảnh báo khi bị vướng rào dừng lại
      if (isStumbled) {
        ctx.fillStyle = "#e74c3c";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText("💥 VƯỚNG RÀO! NÉ SANG LÀN KHÁC", 0, -65);
      }

      ctx.restore();
    }

    // VÒNG LẶP GAME CHÍNH (GAME LOOP)
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // KẾT THÚC CHẶNG ĐUA
    function finishRace() {
      gameEnded = true;
      closeQuiz();

      const contestants = [
        { name: "Bạn (Player)", dist: player.distance },
        { name: "A Cường (NPC)", dist: npc1.distance },
        { name: "Tiểu Hồ (NPC)", dist: npc2.distance }
      ].sort((a, b) => b.dist - a.dist);

      const pRank = contestants.findIndex(c => c.name.includes("Bạn")) + 1;

      document.getElementById('endModal').style.display = 'flex';
      const endTitle = document.getElementById('endTitle');
      const endDetails = document.getElementById('endDetails');

      if (pRank === 1) {
        endTitle.innerText = "🏆 HẠNG 1: CHIẾN THẮNG TUYỆT ĐỐI!";
        endTitle.style.color = "#00d2d3";
      } else {
        endTitle.innerText = `🥈 HẠNG ${pRank}: CỐ GẮNG Ở CHẶNG SAU!`;
        endTitle.style.color = "#feca57";
      }

      endDetails.innerHTML = `
        <b>Bảng xếp hạng chung cuộc:</b><br><br>
        1. ${contestants[0].name} - ${Math.round(contestants[0].dist)}m<br>
        2. ${contestants[1].name} - ${Math.round(contestants[1].dist)}m<br>
        3. ${contestants[2].name} - ${Math.round(contestants[2].dist)}m
      `;
    }
  </script>
