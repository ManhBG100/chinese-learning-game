<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đại Hội Câu Cá 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
    }

    .top-bar {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .btn-back { color: #00d2d3; text-decoration: none; font-weight: bold; font-size: 14px; }
    .timer { background: #e74c3c; padding: 4px 14px; border-radius: 15px; font-weight: bold; font-size: 15px; }

    /* Bảng điểm số */
    .scoreboard {
      display: flex;
      gap: 15px;
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 8px 18px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .score-item { display: flex; align-items: center; gap: 5px; }

    /* Màn Canvas Game */
    #gameCanvas {
      background: #27ae60;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      border: 2px solid #444;
      display: block;
    }

    /* Bảng hướng dẫn & cụm nút điều khiển ảo */
    .controls-guide {
      margin-top: 8px;
      color: #aaa;
      font-size: 13px;
      text-align: center;
    }
    .virtual-keys {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .v-btn {
      background: #2d3436;
      color: #00d2d3;
      border: 1px solid #00d2d3;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .v-btn:active { background: #00d2d3; color: #121212; }

    /* Modal câu hỏi trắc nghiệm */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .quiz-card {
      background: #1e1e1e;
      border: 2px solid #00d2d3;
      border-radius: 12px;
      width: 90%;
      max-width: 440px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .hanzi-box { font-size: 42px; color: #00d2d3; font-weight: bold; margin: 8px 0; }
    .pinyin-box { color: #feca57; font-size: 16px; margin-bottom: 15px; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .opt-btn {
      background: #2d3436; color: #fff; border: 1px solid #576574;
      padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .opt-btn:hover { background: #485460; }
    .opt-btn.correct { background: #2ecc71 !important; border-color: #27ae60; }
    .opt-btn.wrong { background: #e74c3c !important; border-color: #c0392b; }
    .btn-close {
      background: #e74c3c; color: white; border: none; padding: 8px 20px;
      border-radius: 6px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="../index.html" class="btn-back">← Về Hub</a>
    <div class="timer">⏳ Thời gian: <span id="timeVal">50</span>s</div>
  </div>

  <div class="scoreboard">
    <div class="score-item">👤 <b>Bạn:</b> <span id="pScore">0</span> 🐟 (Mồi: <span id="pBait" style="color:#00d2d3;">0</span> 🪱)</div>
    <div class="score-item" style="color:#ff6b6b;">🐧 <b>A Cường:</b> <span id="npc1Score">0</span> 🐟 (Mồi: <span id="npc1Bait">0</span>)</div>
    <div class="score-item" style="color:#feca57;">🦊 <b>Tiểu Hồ:</b> <span id="npc2Score">0</span> 🐟 (Mồi: <span id="npc2Bait">0</span>)</div>
  </div>

  <canvas id="gameCanvas" width="800" height="420"></canvas>

  <div class="controls-guide">
    🎮 <b>Cách chơi:</b> Dùng phím <b>WASD</b> hoặc <b>Mũi tên</b> để chạy tự do. Nhấn <b>SPACE (Phím Cách)</b> hoặc <b>E</b> để tương tác.
  </div>

  <div class="virtual-keys">
    <button class="v-btn" onclick="simulateInteract()">⚡ Phím Cách (Mua Mồi / Câu Cá)</button>
  </div>

  <!-- POPUP TRẮC NGHIỆM ĐỔI MỒI -->
  <div class="modal-overlay" id="quizModal">
    <div class="quiz-card">
      <h3 style="color:#ff9f43;">Quầy Đổi Mồi: Trả lời đúng để nhận mồi!</h3>
      <div class="hanzi-box" id="targetHanzi">...</div>
      <div class="pinyin-box" id="targetPinyin">...</div>
      <div class="quiz-options" id="quizOptions"></div>
      <button class="btn-close" onclick="closeQuizModal()">Rời quầy</button>
    </div>
  </div>

  <!-- POPUP KẾT THÚC -->
  <div class="modal-overlay" id="endModal">
    <div class="quiz-card" style="border-color:#feca57;">
      <h2 style="color:#feca57; margin-bottom:12px;" id="endTitle">KẾT THÚC GIẢI ĐẤU!</h2>
      <p id="endDesc" style="margin-bottom:20px; line-height:1.6;"></p>
      <button class="v-btn" onclick="location.reload()">Chơi lại vòng mới</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let words = [
      { id: 1, hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
      { id: 2, hanzi: "谢谢", pinyin: "xièxie", meaning: "Cảm ơn" },
      { id: 3, hanzi: "苹果", pinyin: "píngguǒ", meaning: "Quả táo" },
      { id: 4, hanzi: "学习", pinyin: "xuéxí", meaning: "Học tập" },
      { id: 5, hanzi: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" }
    ];

    let timeLeft = 50;
    let gameEnded = false;
    let currentQ = null;
    let floatingTexts = [];

    // TẢI TỪ VỰNG TỪ FILE words.txt
    fetch('../words.txt')
      .then(res => res.text())
      .then(txt => {
        const lines = txt.trim().split('\n');
        if (lines.length > 1) {
          const list = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split('\t');
            if (cols.length >= 4) list.push({ id: cols[0].trim(), hanzi: cols[1].trim(), pinyin: cols[2].trim(), meaning: cols[3].trim() });
          }
          if (list.length > 0) words = list;
        }
      }).catch(() => {});

    // VÙNG TỌA ĐỘ BẢN ĐỒ
    const SHOP_ZONE = { x: 30, y: 150, w: 140, h: 140 };
    const DOCK_X = 520;

    // LỚP NHÂN VẬT CHUNG
    class Character {
      constructor(name, color, x, y, isNPC = false) {
        this.name = name;
        this.color = color;
        this.x = x;
        this.y = y;
        this.speed = isNPC ? 1.8 : 3.2;
        this.fish = 0;
        this.bait = 0;
        this.isNPC = isNPC;

        this.bubble = "";
        this.bubbleTimer = 0;
        this.legSwing = 0;
        this.isFishing = false;

        // Dành riêng cho máy trạng thái của NPC
        this.aiState = 'WALK_TO_SHOP';
        this.aiTimer = 0;
        this.targetX = 140;
        this.targetY = 200;
        this.dockY = 180;
      }

      update() {
        if (this.isNPC) {
          this.updateAI();
        }

        if (this.bubbleTimer > 0) {
          this.bubbleTimer--;
          if (this.bubbleTimer <= 0) this.bubble = "";
        }
      }

      updateAI() {
        if (gameEnded) return;

        // Máy trạng thái của NPC
        switch (this.aiState) {
          case 'WALK_TO_SHOP':
            this.moveToTarget(() => {
              this.aiState = 'BUYING';
              this.aiTimer = 70; // Thời gian đứng suy nghĩ trả lời câu hỏi (~1.2s)
              const randomW = words[Math.floor(Math.random() * words.length)];
              this.bubble = `🤔 ${randomW.hanzi}?`;
              this.bubbleTimer = 60;
            });
            break;

          case 'BUYING':
            this.aiTimer--;
            if (this.aiTimer <= 0) {
              this.bait++;
              this.bubble = "✔ +1 Mồi 🪱";
              this.bubbleTimer = 50;
              floatingTexts.push({ text: "+1 Mồi 🪱", x: this.x, y: this.y - 25, life: 30, color: "#feca57" });
              updateUI();

              // Nếu tích luỹ đủ 2 mồi thì đi ra hồ, ngược lại tiếp tục mua
              if (this.bait >= 2) {
                this.aiState = 'WALK_TO_DOCK';
                this.targetX = DOCK_X;
                this.targetY = this.dockY;
              } else {
                this.aiTimer = 70;
                const randomW = words[Math.floor(Math.random() * words.length)];
                this.bubble = `🤔 ${randomW.hanzi}?`;
                this.bubbleTimer = 60;
              }
            }
            break;

          case 'WALK_TO_DOCK':
            this.moveToTarget(() => {
              this.aiState = 'FISHING';
              this.isFishing = true;
              this.aiTimer = 110; // Thời gian câu cá (~1.8s)
              this.bubble = "Đang câu... 🎣";
              this.bubbleTimer = 80;
            });
            break;

          case 'FISHING':
            this.aiTimer--;
            if (this.aiTimer <= 0) {
              if (this.bait > 0) {
                this.bait--;
                if (Math.random() < 0.7) {
                  this.fish++;
                  this.bubble = "Dính cá! 🎉";
                  floatingTexts.push({ text: "+1 Cá 🐟", x: this.x + 25, y: this.y - 20, life: 40, color: "#00d2d3" });
                } else {
                  this.bubble = "Trượt cá rồi 💨";
                }
                this.bubbleTimer = 60;
                updateUI();
              }

              // Nếu hết mồi thì quay về quầy mồi
              if (this.bait <= 0) {
                this.isFishing = false;
                this.aiState = 'WALK_TO_SHOP';
                this.targetX = 140 + (Math.random() * 20 - 10);
                this.targetY = 190 + (this.name === "A Cường" ? 25 : -25);
                this.bubble = "Hết mồi rồi! Về quầy 🏃";
                this.bubbleTimer = 60;
              } else {
                // Tiếp tục câu con tiếp theo
                this.aiTimer = 110;
                this.bubble = "Đang câu... 🎣";
                this.bubbleTimer = 80;
              }
            }
            break;
        }
      }

      moveToTarget(onArrival) {
        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > this.speed) {
          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;
          this.legSwing += 0.25;
        } else {
          this.x = this.targetX;
          this.y = this.targetY;
          this.legSwing = 0;
          if (onArrival) onArrival();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Vẽ cần câu khi đang câu
        if (this.isFishing) {
          ctx.strokeStyle = "#8b5a2b";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(8, 2);
          ctx.lineTo(36, -18);
          ctx.stroke();

          // Dây câu & Phao
          ctx.strokeStyle = "rgba(255,255,255,0.7)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(36, -18);
          ctx.lineTo(62, 14);
          ctx.stroke();

          // Phao nổi
          ctx.fillStyle = "#ff4757";
          ctx.beginPath();
          ctx.arc(62, 14, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        // Chân nhân vật
        ctx.fillStyle = "#2c3e50";
        const leg = Math.sin(this.legSwing) * 5;
        ctx.fillRect(-6, 12, 4, 8 + leg);
        ctx.fillRect(2, 12, 4, 8 - leg);

        // Thân áo
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(-10, -5, 20, 18, 4);
        ctx.fill();

        // Đầu
        ctx.fillStyle = "#ffdcb4";
        ctx.beginPath();
        ctx.arc(0, -12, 9, 0, Math.PI * 2);
        ctx.fill();

        // Tóc/Mũ
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, -16, 9, Math.PI, Math.PI * 2);
        ctx.fill();

        // Tên
        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(this.name, 0, -25);

        // Vòng tròn định vị dưới chân Player
        if (!this.isNPC) {
          ctx.strokeStyle = "#00d2d3";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(0, 21, 12, 5, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Bong bóng hội thoại
        if (this.bubble) {
          ctx.fillStyle = "rgba(0,0,0,0.85)";
          ctx.fillRect(-60, -56, 120, 22);
          ctx.strokeStyle = "#feca57";
          ctx.strokeRect(-60, -56, 120, 22);
          ctx.fillStyle = "#fff";
          ctx.font = "11px sans-serif";
          ctx.fillText(this.bubble, 0, -41);
        }

        ctx.restore();
      }
    }

    // KHỞI TẠO 3 NHÂN VẬT
    const player = new Character("Bạn (Player)", "#0984e3", 300, 220);
    const npc1   = new Character("A Cường", "#d63031", 130, 180, true);
    const npc2   = new Character("Tiểu Hồ", "#fdcb6e", 150, 240, true);
    npc1.dockY = 240;
    npc2.dockY = 320;

    // XỬ LÝ ĐIỀU KHIỂN BÀN PHÍM
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.key.toLowerCase() === 'e') {
        simulateInteract();
      }
    });
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    function simulateInteract() {
      // 1. Kiểm tra nếu đang đứng ở Quầy Mồi
      if (player.x >= SHOP_ZONE.x && player.x <= SHOP_ZONE.x + SHOP_ZONE.w &&
          player.y >= SHOP_ZONE.y && player.y <= SHOP_ZONE.y + SHOP_ZONE.h) {
        openQuizModal();
        return;
      }

      // 2. Kiểm tra nếu đang đứng sát Bến Hồ
      if (player.x >= DOCK_X - 30) {
        playerFishAction();
        return;
      }

      player.bubble = "Hãy đến quầy mồi hoặc mép hồ!";
      player.bubbleTimer = 45;
    }

    function playerFishAction() {
      if (player.isFishing) return;

      if (player.bait <= 0) {
        player.bubble = "Hết mồi rồi! Vào quầy mua thêm 🪱";
        player.bubbleTimer = 50;
        return;
      }

      player.bait--;
      updateUI();
      player.isFishing = true;
      player.bubble = "Đang kéo cần... 🎣";
      player.bubbleTimer = 60;

      setTimeout(() => {
        if (Math.random() < 0.75) {
          player.fish++;
          player.bubble = "Dính 1 chú cá! 🎉";
          floatingTexts.push({ text: "+1 Cá 🐟", x: player.x + 25, y: player.y - 20, life: 40, color: "#00d2d3" });
        } else {
          player.bubble = "Trượt rồi, cá ăn mất mồi 💨";
        }
        player.bubbleTimer = 50;
        player.isFishing = false;
        updateUI();
      }, 1200);
    }

    // XỬ LÝ TRẮC NGHIỆM TẠI QUẦY MỒI
    function openQuizModal() {
      document.getElementById('quizModal').style.display = 'flex';
      nextQuiz();
    }
    function closeQuizModal() {
      document.getElementById('quizModal').style.display = 'none';
    }

    function nextQuiz() {
      currentQ = words[Math.floor(Math.random() * words.length)];
      document.getElementById('targetHanzi').innerText = currentQ.hanzi;
      document.getElementById('targetPinyin').innerText = currentQ.pinyin;

      let wrongs = words.filter(w => w.meaning !== currentQ.meaning).sort(() => 0.5 - Math.random());
      let choices = [currentQ.meaning];
      for (let i = 0; i < Math.min(3, wrongs.length); i++) choices.push(wrongs[i].meaning);
      choices.sort(() => 0.5 - Math.random());

      const grid = document.getElementById('quizOptions');
      grid.innerHTML = '';
      choices.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkQuiz(btn, opt);
        grid.appendChild(btn);
      });
    }

    function checkQuiz(btn, selected) {
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      if (selected === currentQ.meaning) {
        btn.classList.add('correct');
        player.bait++;
        updateUI();
        floatingTexts.push({ text: "+1 Mồi 🪱", x: player.x, y: player.y - 30, life: 30, color: "#2ecc71" });
      } else {
        btn.classList.add('wrong');
      }
      setTimeout(nextQuiz, 650);
    }

    function updateUI() {
      document.getElementById('pScore').innerText = player.fish;
      document.getElementById('pBait').innerText = player.bait;
      document.getElementById('npc1Score').innerText = npc1.fish;
      document.getElementById('npc1Bait').innerText = npc1.bait;
      document.getElementById('npc2Score').innerText = npc2.fish;
      document.getElementById('npc2Bait').innerText = npc2.bait;
    }

    // VẼ BẢN ĐỒ 2D
    let wave = 0;
    function drawMap() {
      // 1. Mặt cỏ
      ctx.fillStyle = "#27ae60";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Đường mòn đất
      ctx.fillStyle = "#d35400";
      ctx.beginPath();
      ctx.moveTo(110, 220);
      ctx.quadraticCurveTo(310, 260, 520, 230);
      ctx.lineWidth = 45;
      ctx.strokeStyle = "#c0392b";
      ctx.stroke();

      // 3. Quầy Mồi (Shop Zone)
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(30, 160, 95, 75);
      for (let s = 0; s < 5; s++) {
        ctx.fillStyle = s % 2 === 0 ? "#e74c3c" : "#ecf0f1";
        ctx.fillRect(25 + s * 21, 140, 21, 25);
      }
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText("QUẦY MỒI", 75, 195);
      ctx.fillText("🏪 鱼饵", 75, 215);

      // Viền vùng tương tác Quầy mồi
      ctx.strokeStyle = "rgba(255, 235, 59, 0.4)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.strokeRect(SHOP_ZONE.x, SHOP_ZONE.y, SHOP_ZONE.w, SHOP_ZONE.h);
      ctx.setLineDash([]);

      // 4. Bến hồ nước
      ctx.fillStyle = "#2980b9";
      ctx.beginPath();
      ctx.ellipse(660, 210, 160, 180, 0, 0, Math.PI * 2);
      ctx.fill();

      // Gợn sóng
      wave += 0.05;
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const py = 120 + i * 60;
        ctx.arc(630 + Math.sin(wave + i) * 12, py, 25, 0, Math.PI);
        ctx.stroke();
      }

      // Cầu tàu gỗ
      ctx.fillStyle = "#795548";
      ctx.fillRect(500, 110, 50, 240);
      ctx.fillStyle = "#5d4037";
      for (let y = 120; y <= 340; y += 20) ctx.fillRect(500, y, 50, 2);

      // Hướng dẫn tương tác nổi khi Player đến gần
      if (player.x >= SHOP_ZONE.x && player.x <= SHOP_ZONE.x + SHOP_ZONE.w &&
          player.y >= SHOP_ZONE.y && player.y <= SHOP_ZONE.y + SHOP_ZONE.h) {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText("👉 Nhấn SPACE để mua mồi", player.x, player.y - 35);
      } else if (player.x >= DOCK_X - 30) {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText("👉 Nhấn SPACE để thả cần", player.x, player.y - 35);
      }
    }

    // VÒNG LẶP CHÍNH
    function gameLoop() {
      // Điều khiển Player di chuyển tự do bằng phím
      if (document.getElementById('quizModal').style.display !== 'flex' && !gameEnded) {
        let moved = false;
        if (keys['w'] || keys['arrowup']) { player.y -= player.speed; moved = true; }
        if (keys['s'] || keys['arrowdown']) { player.y += player.speed; moved = true; }
        if (keys['a'] || keys['arrowleft']) { player.x -= player.speed; moved = true; }
        if (keys['d'] || keys['arrowright']) { player.x += player.speed; moved = true; }

        if (moved) player.legSwing += 0.25;
        else player.legSwing = 0;

        // Giữ Player trong phạm vi bản đồ
        player.x = Math.max(40, Math.min(540, player.x));
        player.y = Math.max(90, Math.min(370, player.y));
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMap();

      npc1.update(); npc1.draw();
      npc2.update(); npc2.draw();
      player.update(); player.draw();

      // Hiệu ứng chữ bay
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ctx.fillStyle = ft.color;
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(ft.text, ft.x, ft.y);
        ft.y -= 0.8;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ĐẾM NGƯỢC THỜI GIAN
    const timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timeVal').innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endGame();
      }
    }, 1000);

    function endGame() {
      gameEnded = true;
      closeQuizModal();
      document.getElementById('endModal').style.display = 'flex';
      const endTitle = document.getElementById('endTitle');
      const endDesc = document.getElementById('endDesc');

      endDesc.innerHTML = `
        <b>Kết quả chung cuộc:</b><br>
        👤 Bạn: <b>${player.fish}</b> con cá<br>
        🐧 A Cường: <b>${npc1.fish}</b> con cá<br>
        🦊 Tiểu Hồ: <b>${npc2.fish}</b> con cá
      `;

      if (player.fish > npc1.fish && player.fish > npc2.fish) {
        endTitle.innerText = "🏆 CHIẾN THẮNG! BẠN LÀ VUA CÂU CÁ!";
      } else if (player.fish === npc1.fish || player.fish === npc2.fish) {
        endTitle.innerText = "🥈 HÒA NHAU! MỘT TRẬN ĐẤU KỊCH TÍNH!";
      } else {
        endTitle.innerText = "🥉 THUA RỒI! HÃY MUA MỒI VÀ GIẬT CẦN NHANH HƠN!";
      }
    }
  </script>
</body>
</html>
