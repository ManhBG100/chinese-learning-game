<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Draw Hán Tự</title>
  <!-- Thư viện nhận diện nét Hanzi Writer -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .game-container {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; }
    .btn-back { color: #00d2d3; text-decoration: none; font-size: 14px; }
    .score-board { color: #2ecc71; font-size: 16px; }
    .timer { color: #ff9f43; font-size: 16px; }

    .prompt-box { margin-bottom: 20px; }
    .prompt-label { font-size: 14px; color: #aaa; text-transform: uppercase; }
    .target-word { font-size: 24px; color: #00d2d3; font-weight: bold; margin-top: 5px; }

    #writer-container {
      margin: 0 auto 20px auto;
      background: #ffffff;
      border-radius: 8px;
      width: 250px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: crosshair;
    }

    .status-msg { font-size: 15px; min-height: 24px; margin-bottom: 15px; color: #fffa65; }

    .btn-action {
      background: #2d3436;
      border: 1px solid #485460;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .btn-action:hover { background: #00d2d3; color: #121212; font-weight: bold; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="top-bar">
      <a href="../index.html" class="btn-back">← Về Hub</a>
      <div class="score-board">Điểm: <span id="score">0</span></div>
      <div class="timer">Thời gian: <span id="time-left">15</span>s</div>
    </div>

    <div class="prompt-box">
      <div class="prompt-label">Hãy vẽ chữ Hán mang nghĩa:</div>
      <div class="target-word" id="meaning-prompt">Đang tải dữ liệu...</div>
    </div>

    <!-- Khung vẽ chữ Hán -->
    <div id="writer-container"></div>

    <div class="status-msg" id="status-msg">Đang chuẩn bị bảng vẽ...</div>

    <button class="btn-action" id="skip-btn" onclick="giveUpAndShow()">Xem đáp án & Bỏ qua</button>
  </div>

  <script>
    // Mảng dữ liệu mặc định phòng trường hợp mạng chậm không tải kịp file
    let charList = [
      { id: 1, hanzi: "大", pinyin: "dà", meaning: "To / Lớn" }
    ];

    let currentIndex = 0;
    let timeLeft = 15;
    let timerInterval = null;
    let writer = null;
    let score = 0;

    const meaningEl = document.getElementById('meaning-prompt');
    const timerEl = document.getElementById('time-left');
    const statusMsg = document.getElementById('status-msg');
    const scoreEl = document.getElementById('score');

    // Đọc dữ liệu trực tiếp từ file words.txt ở thư mục gốc
    fetch('../words.txt')
      .then(res => {
        if (!res.ok) throw new Error("Không thể tải file");
        return res.text();
      })
      .then(text => {
        const lines = text.trim().split('\n');
        if (lines.length > 1) {
          const parsed = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split('\t');
            if (cols.length >= 4) {
              parsed.push({
                id: cols[0].trim(),
                // Lấy ký tự Hán đầu tiên để người chơi vẽ nếu từ vựng có 2 âm tiết trở lên
                hanzi: cols[1].trim().charAt(0), 
                pinyin: cols[2].trim(),
                meaning: cols[3].trim()
              });
            }
          }
          if (parsed.length > 0) charList = parsed;
        }
        initGame();
      })
      .catch(err => {
        console.warn("Lỗi đọc file words.txt, sử dụng danh sách mẫu:", err);
        initGame();
      });

    function initGame() {
      if (currentIndex >= charList.length) {
        document.querySelector('.game-container').innerHTML = `
          <h2 style="color:#00d2d3; margin-bottom: 15px;">Hoàn thành! 🎉</h2>
          <p style="margin-bottom: 10px;">Bạn đã vượt qua toàn bộ từ vựng trong file!</p>
          <p style="color:#ff9f43; font-size: 20px; font-weight: bold; margin-bottom: 25px;">Tổng điểm: ${score}</p>
          <a href="../index.html" class="btn-action" style="text-decoration:none;">Về Hub chính</a>
        `;
        clearInterval(timerInterval);
        return;
      }

      const item = charList[currentIndex];
      meaningEl.innerText = `${item.meaning} (${item.pinyin})`;
      statusMsg.innerText = `Chữ cần viết: "${item.hanzi}" - Hãy vẽ theo thứ tự nét!`;
      statusMsg.style.color = "#fffa65";

      // Reset đồng hồ đếm ngược
      clearInterval(timerInterval);
      timeLeft = 15;
      timerEl.innerText = timeLeft;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          giveUpAndShow(true);
        }
      }, 1000);

      // Khởi tạo bảng vẽ với Hanzi Writer
      document.getElementById('writer-container').innerHTML = '';
      writer = HanziWriter.create('writer-container', item.hanzi, {
        width: 250,
        height: 250,
        showOutline: false, // Ẩn nét viền mờ để người chơi tự nhớ
        showCharacter: false,
        padding: 15,
        strokeColor: '#2c3e50',
        strokeFadeDuration: 400
      });

      // Bật chế độ chấm nét vẽ tự động
      writer.quiz({
        onCorrectStroke: function() {
          statusMsg.innerText = "Nét vẽ đúng! Tiếp tục nét sau...";
          statusMsg.style.color = "#2ecc71";
        },
        onMistake: function() {
          statusMsg.innerText = "Sai nét hoặc nhầm thứ tự nét rồi!";
          statusMsg.style.color = "#e74c3c";
        },
        onComplete: function() {
          clearInterval(timerInterval);
          score += 10;
          scoreEl.innerText = score;
          statusMsg.innerText = "Chính xác hoàn toàn! +10 điểm 🎉";
          statusMsg.style.color = "#00d2d3";
          setTimeout(() => {
            currentIndex++;
            initGame();
          }, 1500);
        }
      });
    }

    function giveUpAndShow(isTimeout = false) {
      clearInterval(timerInterval);
      statusMsg.innerText = isTimeout ? "Hết giờ! Đây là cách vẽ chuẩn:" : "Đáp án mẫu:";
      statusMsg.style.color = "#ff9f43";
      
      // Hiện viền và chạy hoạt cảnh vẽ mẫu
      writer.showOutline();
      writer.animateCharacter({
        onComplete: function() {
          setTimeout(() => {
            currentIndex++;
            initGame();
          }, 2000);
        }
      });
    }
  </script>
</body>
</html>
