<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thử Thách Vẽ Chữ Hán</title>
  <!-- Nhúng thư viện Hanzi Writer qua CDN miễn phí -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .game-container {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
    .btn-back { color: #00d2d3; text-decoration: none; font-size: 14px; }
    .timer { color: #ff9f43; font-size: 18px; }

    .prompt-box { margin-bottom: 20px; }
    .prompt-label { font-size: 14px; color: #aaa; text-transform: uppercase; }
    .target-word { font-size: 28px; color: #00d2d3; font-weight: bold; margin-top: 5px; }

    /* Ô tập viết chữ Hán */
    #writer-container {
      margin: 0 auto 20px auto;
      background: #ffffff;
      border-radius: 8px;
      width: 250px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: crosshair;
    }

    .status-msg { font-size: 16px; min-height: 24px; margin-bottom: 15px; color: #fffa65; }

    .btn-action {
      background: #2d3436;
      border: 1px solid #485460;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }
    .btn-action:hover { background: #00d2d3; color: #121212; font-weight: bold; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="top-bar">
      <a href="../index.html" class="btn-back">← Về Hub</a>
      <div class="timer">Thời gian: <span id="time-left">15</span>s</div>
    </div>

    <div class="prompt-box">
      <div class="prompt-label">Hãy vẽ chữ Hán có nghĩa:</div>
      <div class="target-word" id="meaning-prompt">...</div>
    </div>

    <!-- Khung vẽ chữ -->
    <div id="writer-container"></div>

    <div class="status-msg" id="status-msg">Đặt chuột/ngón tay vào ô để vẽ nét!</div>

    <button class="btn-action" onclick="giveUpAndShow()">Xem đáp án & Bỏ qua</button>
  </div>

  <script>
    // Danh sách các ký tự đơn để người chơi tập vẽ
    const charList = [
      { char: "大", pinyin: "dà", meaning: "To / Lớn" },
      { char: "中", pinyin: "zhōng", meaning: "Ở giữa / Trung" },
      { char: "小", pinyin: "xiǎo", meaning: "Nhỏ / Bé" },
      { char: "人", pinyin: "rén", meaning: "Người" },
      { char: "天", pinyin: "tiān", meaning: "Trời / Ngày" }
    ];

    let currentIndex = 0;
    let timeLeft = 15;
    let timerInterval = null;
    let writer = null;

    const meaningEl = document.getElementById('meaning-prompt');
    const timerEl = document.getElementById('time-left');
    const statusMsg = document.getElementById('status-msg');

    function initGame() {
      if (currentIndex >= charList.length) {
        document.querySelector('.game-container').innerHTML = `
          <h2 style="color:#00d2d3; margin-bottom: 15px;">Tuyệt vời!</h2>
          <p style="margin-bottom: 25px;">Bạn đã hoàn thành thử thách vẽ nét chữ Hán!</p>
          <a href="../index.html" class="btn-action" style="text-decoration:none;">Về Hub chính</a>
        `;
        clearInterval(timerInterval);
        return;
      }

      const item = charList[currentIndex];
      meaningEl.innerText = `${item.meaning} (${item.pinyin})`;
      statusMsg.innerText = "Hãy vẽ theo đúng thứ tự nét!";
      statusMsg.style.color = "#fffa65";

      // Đặt lại thời gian
      clearInterval(timerInterval);
      timeLeft = 15;
      timerEl.innerText = timeLeft;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          giveUpAndShow(true);
        }
      }, 1000);

      // Xoá khung cũ để khởi tạo Hanzi Writer mới
      document.getElementById('writer-container').innerHTML = '';
      writer = HanziWriter.create('writer-container', item.char, {
        width: 250,
        height: 250,
        showOutline: false, // Ẩn nét mờ để người chơi tự nhớ
        showCharacter: false,
        padding: 15,
        strokeColor: '#2c3e50',
        strokeFadeDuration: 400
      });

      // Bật chế độ luyện viết kiểm tra nét vẽ
      writer.quiz({
        onCorrectStroke: function() {
          statusMsg.innerText = "Nét vẽ chuẩn! Tiếp tục nào...";
          statusMsg.style.color = "#2ecc71";
        },
        onMistake: function() {
          statusMsg.innerText = "Sai nét hoặc sai thứ tự rồi, thử lại!";
          statusMsg.style.color = "#e74c3c";
        },
        onComplete: function() {
          clearInterval(timerInterval);
          statusMsg.innerText = "Chính xác hoàn toàn! 🎉";
          statusMsg.style.color = "#00d2d3";
          setTimeout(() => {
            currentIndex++;
            initGame();
          }, 1500);
        }
      });
    }

    function giveUpAndShow(isTimeout = false) {
      clearInterval(timerInterval);
      statusMsg.innerText = isTimeout ? "Hết giờ! Đây là cách vẽ chuẩn:" : "Đáp án mẫu:";
      statusMsg.style.color = "#ff9f43";
      
      // Hiện chữ mẫu và diễn hoạt nét vẽ
      writer.showOutline();
      writer.animateCharacter({
        onComplete: function() {
          setTimeout(() => {
            currentIndex++;
            initGame();
          }, 2000);
        }
      });
    }

    // Bắt đầu vòng lặp game
    initGame();
  </script>
</body>
</html>
